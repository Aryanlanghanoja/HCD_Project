<!DOCTYPE html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
  <meta charset="UTF-8">
  <title>Secure Exam</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      text-align: center;
    }
    #warning {
      color: red;
      font-weight: bold;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>Exam in Progress</h1>
  <p>Please do not switch tabs or minimize the window.</p>
  <p id="warning">Warnings: 0</p>

  <form id="exam-form">
    <!-- Your exam content here -->
    <p>Q1. What is 2 + 2?</p>
    <label for="q1">Answer:</label>
    <input type="text" name="q1" id="q1" placeholder="Enter your answer" title="Answer field for question 1"><br><br>

    <button type="submit">Submit Exam</button>
  </form>

  <script>
    let warningCount = 0;
    const maxWarnings = 3;
    const warningDisplay = document.getElementById("warning");
    const examForm = document.getElementById("exam-form");

    function handleViolation(reason) {
      warningCount++;
      warningDisplay.textContent = `Warnings: ${warningCount} (${reason})`;

      // Optional: Log to server
      fetch('/log-violation', {
        method: 'POST',
        body: JSON.stringify({ reason, warningCount }),
        headers: { 'Content-Type': 'application/json' }
      });

      if (warningCount >= maxWarnings) {
        alert("You have been disqualified for switching tabs too many times.");
        // Submit the form or redirect
        examForm.submit(); // Or use location.href = '/disqualified';
      } else {
        alert(`Warning ${warningCount}/${maxWarnings}: Do not switch tabs!`);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        handleViolation("Tab switch detected");
      }
    });

    window.addEventListener("blur", () => {
      handleViolation("Window focus lost");
    });
  </script>
</body>
</html>
