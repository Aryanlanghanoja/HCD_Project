<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Compiler</title>
    
    <link rel="stylesheet" href="../css/run_code.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" 
          integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/php/php.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>
</head>
<body>
    <div class="container">
        
        <!-- Left Section: Editor -->
        <div class="left-section">
            <div class="editor-header">
                <div class="editor-title">Code Editor</div>
                <button class="btn run-button" onclick="executeCode()">
                    <i class="bi bi-caret-right-fill"></i> Run
                </button>
                <div class="header-right">
                    <select id="languages" class="languages" onchange="changeLanguage()">
                        <option value="c">C</option>
                        <option value="cpp">C++</option>
                        <option value="java">Java</option>
                        <option value="py">Python</option>
                        <option value="js">JavaScript</option>
                    </select>

                </div>
            </div>
            
            <div id="editor"></div>
        </div>
        
        <!-- Right Section: Output -->
        <div class="right-section">
            <div class="console-section">
                <div class="console-header">
                    <div class="tab active">Output</div>
                </div>
                <div class="console-content" id="output">
                    <p>Run the code to see output...</p>
                </div>
            </div>
        </div>
        
    </div>

    <script src="../js/code_runner.js"></script>
</body>
</html>
